<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifeapi</title>
<style>
/* International Style Sheets, Level 1.
   The Swiss style, taken as far as CSS1 (W3C Recommendation, 17 December 1996) can take it:
   1. CSS1's properties, units and selectors only.
   2. Only the browser's own colours: black, white, link blue, visited purple, active red.
   3. Element names only. The markup has no classes to hang styles on.
   4. The page must still read as plain HTML with this sheet switched off.
   5. Generic font families only. The sheet asks for sans-serif; the browser picks the face.
   #/colophon checks this sheet against those rules. */

body {
  margin: 0;
  padding: 1.5em 4% 3em 4%;
  background: white;
  color: black;
  font-family: sans-serif;
  font-size: 16px;
  line-height: 1.3;
}

/* The grid: a label column (the left quarter) and a content column (the rest). main is the
   content column, and labels hang out of it on negative margins (-33.333% of main is a quarter
   of the page), because CSS1 has no grid, no positioning and no sibling selectors. */
main { margin: 0 0 5em 25% }
footer { margin-left: 25%; padding-top: .6em }

header {
  border-top: 12px solid black;
  padding-top: .5em;
  font-weight: bold;
}
header b { float: left; width: 22% }
nav { margin-left: 25% }
nav b { float: none; width: auto }
main nav { margin: .8em 0 0 -33.333% }
td details { margin: 0 }

hr {
  clear: both;
  margin: .6em 0 0 0;
  border-style: solid;
  border-width: 1px 0 0 0;
  border-color: black;
}

h1 {
  margin: .45em 0 .3em -33.333%;
  font-size: 4em;
  line-height: .95;
  letter-spacing: -.045em;
}
h2 {
  clear: both;
  margin: 2.2em 0 .9em -33.333%;
  padding-top: .3em;
  border-top: 3px solid black;
  font-size: 1.5em;
  line-height: 1.1;
  letter-spacing: -.02em;
}
/* Labels are caption-sized, with a line box as tall as the text's, so they sit on its baselines. */
h3 {
  float: left;
  clear: left;
  width: 29.333%;
  margin: 0 0 1em -33.333%;
  font-size: .8125em;
  line-height: 1.6;
}
hgroup { margin-bottom: 2.5em }
hgroup p {
  margin: 0;
  font-size: 1.5em;
  line-height: 1.2;
  letter-spacing: -.01em;
}

p, ul, ol, dl, blockquote, details, form { margin: 0 0 1em 0 }
blockquote { width: 66.666% }
ul, ol { padding: 0 }
ul { list-style-type: square }
li { margin-bottom: .5em }
li a { font-weight: bold }
small { font-size: .8125em }
small a { font-weight: normal }
pre { margin: 0 0 1em 0; font-size: .8125em }

/* Red is the browser's own :active colour, borrowed for anything urgent. */
strong, strong a:link, strong a:visited { color: #e00 }

dt {
  float: left;
  clear: left;
  width: 29.333%;
  margin-left: -33.333%;
  font-weight: bold;
}
dd { margin: 0 0 .35em 0 }

article { clear: both }
article p {
  float: left;
  width: 29.333%;
  margin: 0 0 1em -33.333%;
  font-size: .8125em;
  line-height: 1.6;
}
article hr { margin: 1.2em 0 1.2em -33.333% }

/* No border-collapse until CSS2: the browser's 2px of cell spacing breaks every rule. */
table {
  width: 133.333%;
  margin: 0 0 1.5em -33.333%;
  border: 0;
}
th, td {
  padding: .35em .8em .35em 0;
  border: 0;
  border-bottom: 1px solid black;
  text-align: left;
  vertical-align: top;
}
th { border-bottom: 3px solid black }

/* Big numbers. No viewport units, so they're as big as a desktop allows and no bigger. */
data {
  display: block;
  margin: 0 0 .05em -33.333%;
  font-size: 11em;
  font-weight: bold;
  line-height: .8;
  letter-spacing: -.055em;
}
hgroup data {
  display: inline;
  margin: 0;
  font-size: 1em;
  line-height: 1.2;
  letter-spacing: -.01em;
}
</style>
</head>
<body>
<header>
  <b>lifeapi</b>
  <nav>
    <a href="#/">Today</a> |
    <a href="#/upcoming">Upcoming</a> |
    <a href="#/missing">Missing</a> |
    <a href="#/announcements">Announcements</a> |
    <a href="#/courses">Courses</a> |
    <a href="#/grades">Grades</a> |
    <a href="#/search">Search</a> |
    <a href="#/status">Sync status</a>
  </nav>
</header>
<hr>
<main id="main">Loading…</main>
<hr>
<footer>
  <small>
    <label>API token <input id="token" type="password" size="20"></label>
    · temporary explorer; raw API at <a href="/api/docs" target="_blank">/api/docs</a>
    · set in International Style Sheets, Level 1 (<a href="#/colophon">colophon</a>)
    · <button id="style-toggle" type="button">Turn style sheet off</button>
  </small>
</footer>

<script>
const API = "/api";
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
  return el;
};

// ---------- API ----------

const tokenInput = $("#token");
try { tokenInput.value = localStorage.getItem("lifeapi-token") || ""; } catch {}
tokenInput.addEventListener("change", () => {
  try { localStorage.setItem("lifeapi-token", tokenInput.value); } catch {}
  route();
});

// `json` is sent as the request body.
async function api(path, params = {}, { method = "GET", json } = {}) {
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) {
    if (v == null || v === "" || v === false) continue;
    for (const x of [].concat(v)) qs.append(k, x);
  }
  const url = API + path + (qs.toString() ? "?" + qs : "");
  const headers = tokenInput.value ? { Authorization: `Bearer ${tokenInput.value}` } : {};
  if (json !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(url, { method, headers, body: json === undefined ? undefined : JSON.stringify(json) });
  const body = await res.json().catch(() => null);
  // 422s list their problems.
  const detail = Array.isArray(body?.detail) ? body.detail.map((d) => d.msg).join("; ") : body?.detail;
  if (!res.ok) throw new Error(`${res.status}: ${detail ?? res.statusText} (${url})`);
  return body;
}

// ---------- formatting ----------

const SOURCE_NAMES = {
  google_classroom: "Google Classroom", vhl: "VHL Central", infinite_campus: "Infinite Campus",
  ap_classroom: "AP Classroom", albert: "Albert",
};
const sourceName = (s) => SOURCE_NAMES[s] || (s || "").replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
const label = (s) => s ? s.replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase()) : "";
const DONE = new Set(["turned_in", "completed", "graded", "done", "returned", "handed_in"]);
// GPAs are published to three places; JSON drops the trailing zeros (99.150 arrives as 99.15).
const gpaText = (n) => n.toFixed(3);
// A headline number. The style sheet sets <data> big (and inline in a standfirst).
const num = (value, text = String(value)) => h("data", { value }, text);

const dayKey = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
const time = (d) => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const fullDate = (iso) => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";

function relative(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const days = Math.round((startOf(d) - startOf(now)) / 86400000);
  if (days === 0) {
    const mins = Math.round((d - now) / 60000);
    if (Math.abs(mins) < 60) return mins >= 0 ? `in ${mins} min` : `${-mins} min ago`;
    return `today ${time(d)}`;
  }
  if (days === 1) return `tomorrow ${time(d)}`;
  if (days === -1) return `yesterday ${time(d)}`;
  if (days > 0 && days < 7) return `${d.toLocaleDateString(undefined, { weekday: "long" })} ${time(d)}`;
  return days > 0 ? `in ${days} days` : `${-days} days ago`;
}

const when = (iso) => iso ? h("span", { title: fullDate(iso) }, relative(iso)) : "";

function groupBy(list, keyFn) {
  const m = new Map();
  for (const x of list) { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;
}

const itemHref = (it) => `#/item/${encodeURIComponent(it.source)}/${encodeURIComponent(it.id)}`;
const courseHref = (source, id) => `#/course/${encodeURIComponent(source)}/${encodeURIComponent(id)}`;

function courseLink(it) {
  if (!it.course_name) return "";
  return it.course_id ? h("a", { href: courseHref(it.source, it.course_id) }, it.course_name) : it.course_name;
}

function score(it) {
  if (it.score != null && it.points_possible != null) return `${it.score}/${it.points_possible}`;
  if (it.score != null) return String(it.score);
  if (it.points_possible != null) return `${it.points_possible} pts`;
  return "";
}

// One line per item: [time] Title — Course · Source · status · points
function itemLine(it, { showDue = true, showCourse = true } = {}) {
  const bits = [];
  if (showCourse && it.course_name) bits.push(courseLink(it));
  bits.push(sourceName(it.source));
  if (it.kind !== "assignment") bits.push(label(it.kind));
  if (it.status) bits.push(DONE.has(it.status) ? `✓ ${label(it.status)}` : it.status === "missing" ? h("strong", {}, label(it.status)) : label(it.status));
  if (score(it)) bits.push(score(it));
  const sep = bits.flatMap((b, i) => (i ? [" · ", b] : [b]));
  return h("li", {},
    showDue && it.due_at ? [when(it.due_at), " — "] : null,
    showDue && !it.due_at && it.due_text ? [it.due_text, " — "] : null,
    h("a", { href: itemHref(it) }, it.title || "(untitled)"),
    h("br"), h("small", {}, sep));
}

const itemList = (items, opts) => items.length ? h("ul", {}, items.map((it) => itemLine(it, opts))) : h("p", {}, h("em", {}, "Nothing here."));

function text(s) {
  // Plain text with line breaks kept and bare URLs linked. The breaks are <br>s, not
  // white-space: pre-wrap, which is CSS2.
  const out = h("div");
  String(s).split("\n").forEach((line, i) => {
    if (i) out.append(h("br"));
    for (const part of line.split(/(https?:\/\/\S+)/)) {
      out.append(/^https?:\/\//.test(part) ? h("a", { href: part, target: "_blank" }, part) : part);
    }
  });
  return out;
}

function attachments(list) {
  if (!list?.length) return null;
  return h("ul", {}, list.map((a) => h("li", {},
    a.url ? h("a", { href: a.url, target: "_blank" }, a.title || a.url) : a.title,
    a.type ? h("small", {}, ` (${a.type})`) : null)));
}

// ---------- views ----------

async function viewToday() {
  const [upcoming, missing, ann] = await Promise.all([
    api("/items/upcoming", { days: 7 }), api("/items/missing"), api("/announcements", { days: 3 }),
  ]);
  const recentMissing = missing.filter((it) => new Date(it.due_at) > new Date(Date.now() - 14 * 86400000));
  const missingLink = h("a", { href: "#/missing" }, num(missing.length), " missing");
  return [
    h("hgroup", {},
      h("h1", {}, new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })),
      h("p", {},
        h("a", { href: "#/upcoming" }, num(upcoming.length), " due this week"), " · ",
        missing.length ? h("strong", {}, missingLink) : missingLink, ` (${recentMissing.length} from the last 2 weeks)`, " · ",
        h("a", { href: "#/announcements" }, num(ann.length), " announcements in 3 days"))),
    h("h2", {}, "Due this week"),
    ...byDay(upcoming),
    h("h2", {}, "Recently missed"),
    itemList(recentMissing),
    h("h2", {}, "Latest announcements"),
    announcementList(ann.slice(0, 5)),
    ann.length > 5 ? h("p", {}, h("a", { href: "#/announcements" }, "More announcements →")) : null,
  ];
}

function byDay(items) {
  if (!items.length) return [h("p", {}, h("em", {}, "Nothing due."))];
  return [...groupBy(items, (it) => dayKey(new Date(it.due_at)))].flatMap(([day, list]) => [
    h("h3", {}, day), h("ul", {}, list.map((it) => itemLine(it, { showDue: false }))),
  ]);
}

async function viewUpcoming(params) {
  const days = Number(params.get("days") || 14);
  const includeDone = params.get("done") === "1";
  const items = await api("/items/upcoming", { days, include_done: includeDone });
  const set = (k, v) => { params.set(k, v); location.hash = "#/upcoming?" + params; };
  return [
    h("h1", {}, "Upcoming"),
    h("p", {},
      "Next ", h("select", { onchange: (e) => set("days", e.target.value) },
        [7, 14, 30, 60, 120].map((d) => h("option", { value: d, selected: d === days }, `${d} days`))),
      " ", h("label", {}, h("input", { type: "checkbox", checked: includeDone, onchange: (e) => set("done", e.target.checked ? 1 : 0) }), " include finished work"),
      ` — ${items.length} items`),
    ...byDay(items),
  ];
}

async function viewMissing(params) {
  const all = params.get("all") === "1";
  let items = await api("/items/missing");
  const total = items.length;
  if (!all) items = items.filter((it) => new Date(it.due_at) >= schoolYearStart());
  const groups = [...groupBy(items, (it) => it.course_name || "(no course)")].sort((a, b) => b[1].length - a[1].length);
  return [
    h("h1", {}, "Missing work"),
    h("p", {},
      h("label", {}, h("input", { type: "checkbox", checked: all, onchange: (e) => { location.hash = "#/missing" + (e.target.checked ? "?all=1" : ""); } }),
        " include previous school years"),
      ` — showing ${items.length} of ${total}`),
    h("p", {}, h("small", {}, "Past due and not marked done in the source. Some of these may be optional or already handled offline.")),
    ...groups.flatMap(([course, list]) => [h("h3", {}, `${course} (${list.length})`), itemList(list, { showCourse: false })]),
  ];
}

function schoolYearStart() {
  const now = new Date();
  return new Date(now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1, 7, 1); // Aug 1
}

function announcementList(list) {
  if (!list.length) return h("p", {}, h("em", {}, "No announcements."));
  return h("div", {}, list.map((a) => h("article", {},
    h("p", {},
      h("b", {}, courseLink(a) || sourceName(a.source)), " — ", a.author || "", " · ", when(a.posted_at),
      " · ", h("a", { href: itemHref(a) }, "details")),
    a.description ? h("blockquote", {}, text(a.description)) : h("blockquote", {}, a.title),
    attachments(a.attachments),
    h("hr"))));
}

async function viewAnnouncements(params) {
  const days = Number(params.get("days") || 14);
  const ann = await api("/announcements", { days });
  return [
    h("h1", {}, "Announcements"),
    h("p", {}, "Last ", h("select", { onchange: (e) => { location.hash = "#/announcements?days=" + e.target.value; } },
      [3, 7, 14, 30, 90, 365].map((d) => h("option", { value: d, selected: d === days }, `${d} days`))), ` — ${ann.length}`),
    announcementList(ann),
  ];
}

async function viewCourses(params) {
  const inactive = params.get("inactive") === "1";
  const courses = await api("/courses", { include_inactive: inactive });
  return [
    h("h1", {}, "Courses"),
    h("p", {}, h("label", {}, h("input", { type: "checkbox", checked: inactive, onchange: (e) => { location.hash = "#/courses" + (e.target.checked ? "?inactive=1" : ""); } }),
      " include archived / no longer seen")),
    ...[...groupBy(courses, (c) => c.source)].flatMap(([source, list]) => [
      h("h2", {}, `${sourceName(source)} (${list.length})`),
      h("ul", {}, list.map((c) => h("li", {},
        h("a", { href: courseHref(c.source, c.id) }, c.name),
        c.section ? ` — ${c.section}` : "", c.teacher ? ` · ${c.teacher}` : "",
        c.active === false ? h("em", {}, " (archived)") : ""))),
    ]),
  ];
}

async function viewCourse(source, id, params) {
  const [courses, items, grades] = await Promise.all([
    api("/courses", { source, include_inactive: true }),
    api("/items", { source, course_id: id, limit: 2000, order: "posted" }),
    api("/grades", { source }).catch(() => []),
  ]);
  const c = courses.find((x) => x.id === id) || { name: items[0]?.course_name || id };
  const now = new Date();
  const work = items.filter((it) => it.kind !== "announcement" && it.kind !== "material");
  const upcoming = work.filter((it) => it.due_at && new Date(it.due_at) >= now).sort((a, b) => a.due_at.localeCompare(b.due_at));
  const past = work.filter((it) => !upcoming.includes(it));
  const materials = items.filter((it) => it.kind === "material");
  const ann = items.filter((it) => it.kind === "announcement");
  const courseGrades = grades.filter((g) => g.course_id === id);
  return [
    h("nav", {}, h("a", { href: "#/courses" }, "← Courses")),
    params.get("missing_item") ? h("p", {}, h("strong", {}, "That item hasn't been scraped yet, so here's its course.")) : null,
    h("hgroup", {},
      h("h1", {}, c.name),
      h("p", {}, [sourceName(source), c.section, c.teacher].filter(Boolean).join(" · "),
        c.url ? [" · ", h("a", { href: c.url, target: "_blank" }, `open in ${sourceName(source)}`)] : null)),
    courseGrades.length ? [h("h2", {}, "Grades"), gradeTable(courseGrades)] : null,
    h("h2", {}, `Upcoming (${upcoming.length})`), itemList(upcoming, { showCourse: false }),
    h("h2", {}, `Past & undated work (${past.length})`), itemList(past, { showCourse: false }),
    materials.length ? [h("h2", {}, `Materials (${materials.length})`), itemList(materials, { showCourse: false, showDue: false })] : null,
    h("h2", {}, `Announcements (${ann.length})`), announcementList(ann),
  ];
}

async function viewItem(source, id) {
  const it = await api(`/items/${encodeURIComponent(source)}/${encodeURIComponent(id)}`);
  const facts = [
    ["Course", courseLink(it)],
    ["From", `${sourceName(it.source)} · ${label(it.kind)}`],
    ["Posted by", it.author],
    ["Posted", it.posted_at && [fullDate(it.posted_at), " (", relative(it.posted_at), ")"]],
    ["Due", it.due_at ? [fullDate(it.due_at), " (", relative(it.due_at), ")"] : it.due_text],
    ["Status", it.status === "missing" ? h("strong", {}, label(it.status)) : label(it.status)],
    ["Points", score(it)],
    ["Archived", it.active === false ? "Yes — no longer seen in the source" : null],
  ].filter(([, v]) => v && (!Array.isArray(v) || v.length));
  return [
    h("nav", {}, h("a", { href: "javascript:history.back()" }, "← Back")),
    h("hgroup", {},
      h("h1", {}, it.title),
      it.url ? h("p", {}, h("a", { href: it.url, target: "_blank" }, `Open in ${sourceName(it.source)} ↗`)) : null),
    h("dl", {}, facts.map(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])),
    it.description ? [h("h2", {}, "Description"), h("blockquote", {}, text(it.description))] : null,
    it.attachments?.length ? [h("h2", {}, "Attachments"), attachments(it.attachments)] : null,
    it.extra?.submitted_work?.length ? [h("h2", {}, "Your submitted work"), attachments(it.extra.submitted_work)] : null,
    it.comments?.length ? [h("h2", {}, "Comments"), h("ul", {}, it.comments.map((c) => h("li", {},
      h("b", {}, c.author || "?"), c.private ? " (private)" : "", c.posted_at ? ` · ${c.posted_at}` : "", ": ", c.text)))] : null,
    h("details", {}, h("summary", {}, "All data"), h("pre", {}, JSON.stringify(it, null, 2))),
  ];
}

function gradeTable(grades) {
  return h("table", { border: 1, cellpadding: 4 },
    h("tr", {}, ["Course", "Term", "Grade", "%", "Teacher", ""].map((x) => h("th", {}, x))),
    grades.map((g) => h("tr", {},
      h("td", {}, g.course_id ? h("a", { href: courseHref(g.source, g.course_id) }, g.course_name) : g.course_name),
      h("td", {}, [g.term, g.task].filter(Boolean).join(" — ")),
      h("td", {}, h("b", {}, g.letter || "")),
      h("td", {}, g.percent != null ? `${g.percent}%` : ""),
      h("td", {}, g.teacher || ""),
      h("td", {}, h("a", { href: `#/grade/${encodeURIComponent(g.source)}/${encodeURIComponent(g.id)}` },
        g.entries?.length ? `${g.entries.length} assignments →` : "details →")))));
}

async function viewGrades(params) {
  const all = await api("/grades");
  const gpas = all.filter((g) => g.gpa != null);
  const grades = all.filter((g) => g.gpa == null);
  const terms = [...new Set(grades.map((g) => g.term).filter(Boolean))];
  const term = params.get("term") || "";
  const shown = term ? grades.filter((g) => g.term === term) : grades;
  return [
    h("h1", {}, "Grades"),
    gpas.map((g) => h("p", {}, `${g.course_name}${g.term ? ` (${g.term})` : ""}: `, num(g.gpa, gpaText(g.gpa)),
      g.extra?.weighted === false ? " unweighted" : "", g.extra?.rank != null ? ` · rank ${g.extra.rank}${g.extra.out_of ? ` of ${g.extra.out_of}` : ""}` : "")),
    terms.length > 1 ? h("p", {}, "Term ", h("select", { onchange: (e) => { location.hash = "#/grades" + (e.target.value ? "?term=" + encodeURIComponent(e.target.value) : ""); } },
      h("option", { value: "" }, "All"), terms.map((t) => h("option", { value: t, selected: t === term }, t)))) : null,
    shown.length ? gradeTable(shown) : h("p", {}, h("em", {}, "No grades yet.")),
  ];
}

async function viewGrade(source, id) {
  const g = (await api("/grades", { source, include_inactive: true })).find((x) => x.id === id);
  if (!g) throw new Error("Grade not found");
  return [
    h("nav", {}, h("a", { href: "#/grades" }, "← Grades")),
    h("hgroup", {},
      h("h1", {}, g.course_name),
      h("p", {}, [g.term, g.task, g.teacher, sourceName(g.source)].filter(Boolean).join(" · "),
        g.url ? [" · ", h("a", { href: g.url, target: "_blank" }, "open ↗")] : null)),
    h("p", {}, g.gpa != null ? ["GPA ", num(g.gpa, gpaText(g.gpa))]

// Minutes as "30 min", "2 h", "1 day 6 h".
function duration(mins) {
  const d = Math.floor(mins / 1440), hrs = Math.floor((mins % 1440) / 60), m = mins % 60;
  return [d && `${d} day${d === 1 ? "" : "s"}`, hrs && `${hrs} h`, m && `${m} min`].filter(Boolean).join(" ");
}
const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : { 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
// A source's partial fetch, by its description (e.g. "Overall GPA only").

    + (sc.partial ? `: ${partialText(s, sc.partial)}, everything every ${ordinal(sc.full_every)} time` : "")

// Fills in and re-renders its own box (every 5 s while a sync is queued or running) rather
// than going through route(), so there's no "Loading…" flash.
async function viewStatus() {
  const box = h("div");
  let timer;

  async function sync(sources) {
    try { await api("/sync", { source: sources }, { method: "POST" }); }
    catch (e) { alert(`Couldn't request a sync: ${e.message}`); }
    render();
  }

  // `what` names the setting in the error ("schedule", "browser").
  const saveSetting = (what) => async (request) => {
    try { await request; }
    catch (e) { alert(`Couldn't change the ${what}: ${e.message}`); return; } // leaves the form as it was
    render();
  };

  async function clear() {
    if (!confirm("Clear the sync request list? Queued requests are cancelled; running ones stay.")) return;
    try { await api("/sync", {}, { method: "DELETE" }); }
    catch (e) { alert(`Couldn't clear sync requests: ${e.message}`); }
    render();
  }

  async function render() {
    clearTimeout(timer);
    const [sources, requests] = await Promise.all([api("/sources"), api("/sync", { limit: 10 })]);
    const active = requests.filter((r) => r.status === "pending" || r.status === "running");
    const enabled = sources.filter((s) => s.enabled).map((s) => s.source);
    const activeFor = (name) => active.find((r) => (r.sources ?? enabled).includes(name))?.status;
    box.replaceChildren(...[ // unlike h(), replaceChildren() would print a null as "null"
      h("p", {}, h("button", { onclick: () => sync(), disabled: active.some((r) => !r.sources) }, "Sync all now")),
      h("table", { border: 1, cellpadding: 4 },
        h("tr", {}, ["Source", "Schedule", "Browser", "Next fetch", "Last run", "Result", "Courses", "Items", "Grades", "Last full success", ""].map((x) => h("th", {}, x))),
        sources.map((s) => {
          const r = s.last_run, sc = s.schedule;
          const result = !r ? "never run" : r.ok == null ? (r.finished_at ? "?" : "running…") : r.ok ? "OK" : failure(r.error, s.login_command, r.has_log ? r.run_id : null);
          const state = activeFor(s.source);
          return h("tr", {},
            h("td", {}, sourceName(s.source), s.enabled ? null : h("small", {}, " (disabled)")),
            h("td", {}, scheduleText(s),
              h("details", { "data-edit": "" }, h("summary", {}, "change"), scheduleForm(s, saveSetting("schedule")))),
            h("td", {}, browserText(s),
              h("details", { "data-edit": "" }, h("summary", {}, "change"), browserForm(s, saveSetting("browser")))),
            h("td", {}, !sc.next_fetch_at ? "—" : new Date(sc.next_fetch_at) <= new Date() ? "due now" : when(sc.next_fetch_at),
              sc.next_fetch_partial ? h("small", {}, ` (${partialText(s, sc.next_fetch_partial)})`) : null),
            h("td", {}, r ? when(r.started_at) : ""),
            h("td", {}, result, r?.partial ? h("small", {}, ` (${partialText(s, r.partial)})`) : null),
            h("td", {}, r?.counts.courses ?? ""), h("td", {}, r?.counts.items ?? ""), h("td", {}, r?.counts.grades ?? ""),
            h("td", {}, s.last_success_at ? when(s.last_success_at) : "never"),
            h("td", {}, state === "running" ? "Syncing…" : state === "pending" ? "Queued"
              : h("button", { onclick: () => sync(s.source) }, "Sync")));
        })),
      h("h2", {}, "Sync requests"),
      requests.length ? h("p", {}, h("button", { onclick: clear }, "Clear list")) : null,
      requests.length ? h("table", { border: 1, cellpadding: 4 },
        h("tr", {}, ["Requested", "Sources", "Status", "Finished"].map((x) => h("th", {}, x))),
        requests.map((r) => h("tr", {},
          h("td", {}, when(r.requested_at)),
          h("td", {}, r.sources ? r.sources.map(sourceName).join(", ") : "All sources"),
          h("td", {}, r.status === "failed" ? failure(r.error) : r.status === "running" ? "Running…" : label(r.status)),
          h("td", {}, when(r.finished_at)))))
        : h("p", {}, h("em", {}, "None yet.")),
      active.length ? h("p", {}, h("small", {}, "Refreshing while a sync is queued or running.")) : null,
    ].filter((x) => x != null));
    function tick() {
      if (!box.isConnected) return; // navigated away
      if (box.querySelector("details[data-edit][open]")) timer = setTimeout(tick, 5000); // don't wipe an edit
      else render().catch(() => {});
    }
    if (active.length) timer = setTimeout(tick, 5000);
  }

  await render(); // errors on the first load go to route()'s "Couldn't load"
  return [h("h1", {}, "Sync status"),
    h("p", {}, h("small", {}, "Each source is fetched on its schedule. A partial fetch reads only part of a source (like Infinite Campus's GPA); a sync is always a full fetch. A headed browser is a visible one, which gets past some sites' bot checks.")),
    box];
}

// ---------- link resolver: <this site>/<any source URL> → the matching page ----------

// Google Classroom URLs carry IDs as base64 of the numeric ID we store.
function classroomId(seg) {
  if (/^\d+$/.test(seg)) return seg;
  try {
    const s = atob(seg.replace(/-/g, "+").replace(/_/g, "/"));
    return /^\d+$/.test(s) ? s : null;
  } catch { return null; }
}

// Course/item IDs are global across Google accounts, so the account selector (/u/{n} or
// ?authuser=) is ignored and a link copied while signed into any account resolves.
function parseClassroom(u) {
  if (u.hostname !== "classroom.google.com") return null;
  const parts = u.pathname.replace(/^\/u\/\d+(?=\/|$)/, "").split("/").filter(Boolean);
  // /c/{course}/{a|m|sa|mc|p}/{item}[/details|/submissions/...]
  if (parts[0] === "c" && parts.length >= 4) {
    const item = classroomId(parts[3]);
    if (item) return { item, course: classroomId(parts[1]) };
  }
  // /c/{course}, /w/{course}/t/all, /r/{course}/sort-name, ...
  if (["c", "w", "r"].includes(parts[0]) && parts[1]) {
    const course = classroomId(parts[1]);
    if (course) return { course };
  }
  return null;
}

const urlPathKey = (u) => u.hostname.replace(/^www\./, "") + u.pathname.replace(/^\/u\/\d+(?=\/|$)/, "").replace(/\/+$/, "");

// Match against the source URLs stored on every record. Host + path must match; query params
// break ties (e.g. Infinite Campus pages differ only by classroomSectionID / selectedTermID).
function bestUrlMatch(u, candidates) {
  const key = urlPathKey(u);
  let best = null, bestScore = -Infinity;
  for (const c of candidates) {
    let v;
    try { v = new URL(c.url); } catch { continue; }
    if (urlPathKey(v) !== key) continue;
    let score = 0;
    for (const [k, val] of v.searchParams) {
      if (k === "authuser") continue;
      if (u.searchParams.get(k) === val) score += 1;
      else score -= u.searchParams.has(k) ? 1000 : 1; // a conflicting value rules it out
    }
    if (score > bestScore && score > -1000) { best = c; bestScore = score; }
  }
  return best;
}

async function allItems() {
  const out = [];
  for (let offset = 0; ; offset += 2000) {
    const page = await api("/items", { include_inactive: true, limit: 2000, offset });
    out.push(...page);
    if (page.length < 2000) return out;
  }
}

function parseLink(raw) {
  let s = raw.trim().replace(/^(https?):\/(?!\/)/i, "$1://"); // some clients collapse "//" in paths
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = "https://" + s;
  try { return new URL(s); } catch { return null; }
}

const exists = (path) => api(path).then(() => true, (e) => (e.message.startsWith("404") ? false : Promise.reject(e)));

async function resolveLink(u) {
  const gc = parseClassroom(u);
  if (gc?.item && await exists(`/items/google_classroom/${gc.item}`)) return `#/item/google_classroom/${gc.item}`;

  const [items, courses, grades] = [await allItems(), await api("/courses", { include_inactive: true }), await api("/grades", { include_inactive: true })];
  const match = bestUrlMatch(u, [
    ...items.map((x) => ({ url: x.url, href: itemHref(x) })),
    ...courses.map((x) => ({ url: x.url, href: courseHref(x.source, x.id) })),
    ...grades.map((x) => ({ url: x.url, href: `#/grade/${encodeURIComponent(x.source)}/${encodeURIComponent(x.id)}` })),
  ]);
  if (match) return match.href;

  // A Classroom item we haven't scraped yet still lands on its course, if we know the course.
  if (gc?.course && courses.some((c) => c.source === "google_classroom" && c.id === gc.course)) {
    return courseHref("google_classroom", gc.course) + (gc.item ? "?missing_item=1" : "");
  }
  return null;
}

function linkForm(value = "") {
  const input = h("input", { type: "url", value, size: 60, placeholder: "https://classroom.google.com/u/1/c/…/a/…/details" });
  return h("form", { onsubmit: (e) => { e.preventDefault(); location.hash = "#/open?url=" + encodeURIComponent(input.value); } },
    input, " ", h("button", {}, "Open"));
}

async function viewOpen(params) {
  const raw = params.get("url") || "";
  const u = parseLink(raw);
  if (u) {
    const target = await resolveLink(u);
    if (target) { location.replace(target); return "Opening…"; }
  }
  return [
    h("h1", {}, "Link not found"),
    h("p", {}, u ? ["lifeapi has nothing matching ", h("a", { href: u.href, target: "_blank" }, u.href), ". It may not have been scraped yet."] : `"${raw}" isn't a URL.`),
    h("p", {}, "Try another link:"), linkForm(raw),
  ];
}

// ---------- colophon: the style sheet's rules, checked against the style sheet itself ----------

// CSS1, section 5: every property, and the keyword values of the ones that only take keywords.
const CSS1_PROPERTIES = `font-family font-style font-variant font-weight font-size font
  color background-color background-image background-repeat background-attachment background-position background
  word-spacing letter-spacing text-decoration vertical-align text-transform text-align text-indent line-height
  margin-top margin-right margin-bottom margin-left margin padding-top padding-right padding-bottom padding-left padding
  border-top-width border-right-width border-bottom-width border-left-width border-width border-color border-style
  border-top border-right border-bottom border-left border width height float clear
  display white-space list-style-type list-style-image list-style-position list-style`.split(/\s+/);
const CSS1_KEYWORDS = {
  display: "block inline list-item none", "white-space": "normal pre nowrap", float: "left right none",
  clear: "none left right both", "text-transform": "capitalize uppercase lowercase none",
  "text-align": "left right center justify", "text-decoration": "none underline overline line-through blink",
  "font-style": "normal italic oblique", "font-variant": "normal small-caps",
  "font-weight": "normal bold bolder lighter 100 200 300 400 500 600 700 800 900",
  "border-style": "none dotted dashed solid double groove ridge inset outset",
  "list-style-type": "disc circle square decimal lower-roman upper-roman lower-alpha upper-alpha none",
  "list-style-position": "inside outside", "background-repeat": "repeat repeat-x repeat-y no-repeat",
  "background-attachment": "scroll fixed",
};
const CSS1_UNITS = ["px", "pt", "pc", "in", "cm", "mm", "em", "ex", "%"];
// Rule 5: CSS1's generic families are the only fonts the sheet may ask for.
const GENERIC_FAMILIES = ["serif", "sans-serif", "cursive", "fantasy", "monospace"];
// Faces a browser might use for sans-serif, most likely first (Helvetica before Arial: Arial
// copies Helvetica's widths, so they're told apart by drawing them).
const SANS_FACES = ["Helvetica", "Arial", "Helvetica Neue", "Liberation Sans", "DejaVu Sans", "Noto Sans", "Roboto",
  "Segoe UI", "Verdana", "Geneva", "Lucida Grande"];

// Which installed face the browser draws for a generic family: a sample is drawn in the
// generic and in each candidate (falling back to monospace, so a missing face can't match),
// and the pixels compared. Null if none match.
function resolveFamily(generic, candidates) {
  const canvas = Object.assign(document.createElement("canvas"), { width: 480, height: 64 });
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const draw = (font) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = `40px ${font}`;
    ctx.fillText("RQGatey1&?", 4, 48);
    return ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  };
  const target = draw(generic);
  return candidates.find((face) => draw(`"${face}", monospace`).every((x, i) => x === target[i])) ?? null;
}
const CSS1_COLOURS = { aqua: "#00ffff", black: "#000000", blue: "#0000ff", fuchsia: "#ff00ff", gray: "#808080",
  green: "#008000", lime: "#00ff00", maroon: "#800000", navy: "#000080", olive: "#808000", purple: "#800080",
  red: "#ff0000", silver: "#c0c0c0", teal: "#008080", white: "#ffffff", yellow: "#ffff00" };
// Rule 2: the colours a browser uses before any style sheet arrives.
const PALETTE = { "#000000": "text", "#ffffff": "paper", "#0000ee": "link", "#551a8b": "visited link", "#ee0000": "active link" };

const hex6 = (c) => {
  c = c.toLowerCase();
  if (CSS1_COLOURS[c]) return CSS1_COLOURS[c];
  return c.length === 4 ? "#" + [...c.slice(1)].map((x) => x + x).join("") : c;
};

function parseSheet(css) {
  const src = css.replace(/\/\*[\s\S]*?\*\//g, "");
  const atRules = [...src.matchAll(/@[\w-]+/g)].map((m) => m[0]);
  const rules = [...src.matchAll(/([^{}]*)\{([^{}]*)\}/g)].map((m) => ({
    selectors: m[1].split(",").map((s) => s.trim().replace(/\s+/g, " ")),
    decls: m[2].split(";").map((d) => d.trim()).filter(Boolean).map((d) => {
      const i = d.indexOf(":");
      return { prop: d.slice(0, i).trim().toLowerCase(), value: d.slice(i + 1).trim() };
    }),
  }));
  return { atRules, rules };
}

function selectorProblem(sel) {
  if (/[>+~]/.test(sel)) return "child and sibling combinators are CSS2";
  if (sel.includes("[")) return "attribute selectors are CSS2";
  if (sel.includes("*")) return "the universal selector is CSS2";
  if (sel.includes("::")) return "double-colon pseudo-elements are CSS3";
  const parts = sel.split(" ");
  for (const [i, part] of parts.entries()) {
    if (/[.#]/.test(part)) return "CSS1 has classes and IDs, but rule 3 says element names only";
    const m = part.match(/^([a-z][a-z0-9]*)((?::[a-z-]+)*)$/i);
    if (!m) return "not a CSS1 selector";
    for (const pseudo of m[2].split(":").filter(Boolean)) {
      if (["link", "visited", "active"].includes(pseudo)) {
        if (m[1].toLowerCase() !== "a") return `in CSS1, :${pseudo} belongs to A only`;
      } else if (["first-line", "first-letter"].includes(pseudo)) {
        if (i !== parts.length - 1) return `:${pseudo} has to come last`;
      } else return `:${pseudo} isn't CSS1`;
    }
  }
  return null;
}

function declarationProblem({ prop, value }) {
  if (!CSS1_PROPERTIES.includes(prop)) return `${prop} isn't one of CSS1's ${CSS1_PROPERTIES.length} properties`;
  if (prop === "font-family" || prop === "font") {
    // In the font shorthand, the families follow the size (and any /line-height).
    const families = prop === "font" ? value.replace(/^.*?[\d.]+(px|pt|pc|in|cm|mm|em|ex|%)(\s*\/\s*[\d.]+[a-z%]*)?\s+/i, "") : value;
    const named = families.split(",").map((f) => f.trim()).find((f) => !GENERIC_FAMILIES.includes(f.toLowerCase()));
    if (named) return `rule 5: ${named} is a font's name, and only generic families are allowed`;
  }
  const v = value.replace(/!\s*important$/i, "").replace(/"[^"]*"|'[^']*'/g, '""').trim();
  if (/\b(inherit|initial|unset|revert)\b/i.test(v)) return "global keywords like inherit came later";
  const fn = v.match(/([a-z-]+)\(/i);
  if (fn && !["rgb", "url"].includes(fn[1].toLowerCase())) return `${fn[1]}() isn't CSS1`;
  if ((prop === "color" || prop === "background-color") && /^[a-z]+$/i.test(v)
      && !CSS1_COLOURS[v.toLowerCase()] && !(prop === "background-color" && v === "transparent")) {
    return `${v} isn't one of CSS1's 16 colour names`;
  }
  const colours = v.match(/#[0-9a-f]{3,6}\b|\b[a-z]+\b/gi)?.filter((t) => t.startsWith("#") || CSS1_COLOURS[t.toLowerCase()]) ?? [];
  for (const c of colours) if (!PALETTE[hex6(c)]) return `rule 2: ${c} isn't one of the browser's own colours`;
  for (const [, , unit] of v.replace(/#[0-9a-f]+/gi, "").matchAll(/(-?\d*\.?\d+)([a-z%]*)/gi)) {
    if (unit && !CSS1_UNITS.includes(unit.toLowerCase())) return `${unit} isn't a CSS1 unit`;
  }
  const allowed = CSS1_KEYWORDS[prop]?.split(" ");
  const bad = allowed && v.split(/\s+/).find((t) => !allowed.includes(t.toLowerCase()));
  if (bad) return `${bad} isn't a CSS1 value for ${prop}`;
  if (prop.startsWith("padding") && /(^|\s)-/.test(v)) return "CSS1 doesn't allow negative padding";
  return null;
}

function checkSheet(css) {
  const { atRules, rules } = parseSheet(css);
  const problems = atRules.filter((a) => a !== "@import").map((a) => [a, "the only at-rule in CSS1 is @import"]);
  const used = new Map(), colours = new Set();
  for (const r of rules) {
    for (const s of r.selectors) { const why = selectorProblem(s); if (why) problems.push([s, why]); }
    for (const d of r.decls) {
      const why = declarationProblem(d);
      if (why) problems.push([`${d.prop}: ${d.value}`, why]);
      used.set(d.prop, (used.get(d.prop) || 0) + 1);
      for (const c of d.value.match(/#[0-9a-f]{3,6}\b|\b[a-z]+\b/gi) ?? []) if (PALETTE[hex6(c)]) colours.add(hex6(c));
    }
  }
  const lines = css.trim().split("\n").length;
  return { problems, used, colours, rules: rules.length, declarations: rules.reduce((n, r) => n + r.decls.length, 0), lines };
}

function viewColophon() {
  const css = $("style").textContent;
  const c = checkSheet(css);
  const sep = (list) => list.flatMap((x, i) => (i ? [", ", x] : [x]));
  const undeclared = Object.keys(PALETTE).filter((x) => !c.colours.has(x));
  const face = resolveFamily("sans-serif", SANS_FACES);
  return [
    h("hgroup", {},
      h("h1", {}, "Colophon"),
      h("p", {}, "This explorer is set in International Style Sheets, Level 1: the Swiss style, taken as far as CSS1 could take it in December 1996, and not a step further.")),
    h("h2", {}, "The rules"),
    h("ol", {},
      h("li", {}, "CSS Level 1 only: its ", CSS1_PROPERTIES.length, " properties, its units and its selectors. Nothing from CSS2 or later, so no grid, flexbox, positioning, media queries, :hover, web fonts, max-width or overflow."),
      h("li", {}, "Only the colours the browser already uses: black text on white paper, ",
        h("a", { href: "#/colophon?unvisited=" + Date.now() }, "link blue"), ", ",
        h("a", { href: "#/colophon" }, "visited purple"), ", and ", h("strong", {}, "the red a link turns while you click it"), ", borrowed for anything urgent."),
      h("li", {}, "Element names only. The markup has no classes, so the style sheet can style h1, dt and blockquote, but never .anything."),
      h("li", {}, "The style sheet has to be optional. Turn it off (the button at the bottom of every page) and each page still reads as plain HTML."),
      h("li", {}, "Generic font families only: serif, sans-serif, monospace, cursive or fantasy, never a font's name. The style sheet asks for sans-serif, and your browser decides what that means.")),
    h("h2", {}, "The face"),
    h("p", {}, "On this computer, sans-serif is: ", num(face ?? "?", face ?? "unknown")),
    h("p", {}, face === "Helvetica"
      ? "The Swiss typeface is what a Mac gives you for not asking. On Windows the same style sheet gets Arial, which copies Helvetica's widths and not much else; on Linux it's usually DejaVu Sans or Liberation Sans."
      : face
        ? `Not Helvetica. On a Mac the same style sheet gets Helvetica, and on Windows Arial. Here the Swiss style is set in ${face}, because that's what this browser means by sans-serif.`
        : "Not any of the usual faces, so the browser (or you, in its font settings) chose something else."),
    h("h2", {}, "Inspection"),
    h("p", {}, "Problems found: ", num(c.problems.length)),
    c.problems.length
      ? h("table", { border: 1, cellpadding: 4 }, h("tr", {}, h("th", {}, "Where"), h("th", {}, "Why")),
        c.problems.map(([where, why]) => h("tr", {}, h("td", {}, h("code", {}, where)), h("td", {}, h("strong", {}, why)))))
      : h("p", {}, `Checked just now, in your browser, against the style sheet in this page: ${c.rules} rules, ${c.declarations} declarations, ${c.lines} lines.`),
    h("dl", {},
      h("dt", {}, `Uses ${c.used.size} of ${CSS1_PROPERTIES.length} properties`),
      h("dd", {}, sep([...c.used].sort((a, b) => b[1] - a[1]).map(([p, n]) => [h("b", {}, p), ` ×${n}`]))),
      h("dt", {}, "Never needed"),
      h("dd", {}, sep(CSS1_PROPERTIES.filter((p) => !c.used.has(p)))),
      h("dt", {}, "Colours"),
      h("dd", {}, sep([...c.colours].map((x) => `${x} (${PALETTE[x]})`)),
        undeclared.length ? ["; and, never declared, the browser's own ", sep(undeclared.map((x) => `${x} (${PALETTE[x]})`))] : null)),
    h("h2", {}, "What stayed default"),
    h("ul", {},
      h("li", {}, "Links are the browser's: blue, underlined, purple once visited. There's no :hover in CSS1, so nothing happens under the pointer."),
      h("li", {}, "Rules break at every table column. Borders can't collapse until CSS2, so the 2 pixels the browser leaves between cells cut each rule into pieces."),
      h("li", {}, "Headlines don't scale with the window. Without viewport units or media queries they're a fixed size, and on a phone they wrap or run off the edge."),
      h("li", {}, "Punctuation stays. CSS1 can't add or remove text, so the separators written for the plain page (the | between menu items, the · between facts, the colon in \"GPA:\") show in the styled one too."),
      h("li", {}, "Buttons, fields, menus and disclosure triangles belong to the operating system, as they did in 1996."),
      h("li", {}, "The typeface is the browser's default sans-serif, chosen in its settings, not by this page."),
      h("li", {}, "Preformatted text runs off the edge, because overflow is CSS2."),
      h("li", {}, "The grid is floats and negative margins: content in the right three quarters, labels hung into the left quarter."),
      h("li", {}, "The bullets survived. They're squares now.")),
    h("h2", {}, "The style sheet"),
    h("pre", {}, css.trim()),
  ];
}

// ---------- router ----------

const routes = [
  [/^\/$/, viewToday],
  [/^\/upcoming$/, viewUpcoming],
  [/^\/missing$/, viewMissing],
  [/^\/announcements$/, viewAnnouncements],
  [/^\/courses$/, viewCourses],
  [/^\/course\/([^/]+)\/([^/]+)$/, viewCourse],
  [/^\/item\/([^/]+)\/([^/]+)$/, viewItem],
  [/^\/grades$/, viewGrades],
  [/^\/grade\/([^/]+)\/([^/]+)$/, viewGrade],
  [/^\/search$/, viewSearch],
  [/^\/status$/, viewStatus],
  [/^\/open$/, viewOpen],
  [/^\/colophon$/, viewColophon],
];

const NAV = [["#/", "Today"], ["#/upcoming", "Upcoming"], ["#/missing", "Missing"], ["#/announcements", "Announcements"],
  ["#/courses", "Courses"], ["#/grades", "Grades"], ["#/search", "Search"], ["#/status", "Sync status"]];

// The current section is plain bold text rather than a link to itself: "you are here" in both
// modes, since CSS1 can't select a link by its aria-current.
function renderNav(path) {
  const top = path.split("/")[1];
  const section = { course: "courses", grade: "grades" }[top] ?? top;
  $("header nav").replaceChildren(...NAV.flatMap(([href, name], i) => [i ? " | " : null,
    href.slice(2) === section ? h("b", { "aria-current": "page" }, name) : h("a", { href }, name)]).filter((x) => x != null));
}

// The style sheet can be switched off, to show the plain page underneath.
const styleToggle = $("#style-toggle");
function setStyled(on) {
  $("style").disabled = !on;
  styleToggle.textContent = on ? "Turn style sheet off" : "Turn style sheet on";
}
let styled = true;
try { styled = localStorage.getItem("lifeapi-style") !== "off"; } catch {}
setStyled(styled);
styleToggle.addEventListener("click", () => {
  styled = !styled;
  setStyled(styled);
  try { localStorage.setItem("lifeapi-style", styled ? "on" : "off"); } catch {}
});

let seq = 0;
async function route() {
  // <this site>/<source URL>: everything after the first "/" (query and fragment included) is the link.
  if (location.pathname !== "/" && location.pathname !== "/index.html") {
    const link = location.href.slice(location.origin.length + 1);
    history.replaceState(null, "", "/#/open?url=" + encodeURIComponent(link));
  }
  const [path, query] = (location.hash.slice(1) || "/").split("?");
  const params = new URLSearchParams(query || "");
  renderNav(path);
  const main = $("#main");
  const mine = ++seq;
  main.textContent = "Loading…";
  for (const [re, view] of routes) {
    const m = path.match(re);
    if (!m) continue;
    try {
      const args = m.slice(1).map(decodeURIComponent);
      const content = await view(...args, params);
      if (mine === seq) main.replaceChildren(...[content].flat(Infinity).filter((x) => x != null && x !== false));
    } catch (e) {
      if (mine === seq) main.replaceChildren(h("p", {}, h("strong", {}, "Couldn't load: "), e.message));
    }
    if (mine === seq) document.querySelector("[autofocus]")?.focus();
    return;
  }
  main.replaceChildren(h("p", {}, "Page not found. ", h("a", { href: "#/" }, "Go to Today")));
}

addEventListener("hashchange", route);
route();
</script>
