<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #fff; color: #000; }
  body {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: clamp(16px, 3vw, 48px);
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 1em;
    border-top: clamp(4px, 0.6vw, 10px) solid #000;
    padding-top: 0.6em;
    font-size: clamp(14px, 1.4vw, 22px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  #gpa {
    align-self: end;
    justify-self: start;
    white-space: nowrap;
    font-weight: 700;
    font-size: 30vw; /* refitted to the width by fit() */
    line-height: 0.78; /* hugs the digits' cap height, so the bottom padding reads true */
    letter-spacing: -0.055em;
    padding-right: 0.055em; /* cancels the tracking after the last digit */
  }
</style>
</head>
<body>
<main>
  <header><span>Grade point average</span><span id="note">Percent</span></header>
  <p id="gpa" aria-live="polite">&nbsp;</p>
</main>
<script>
const out = document.getElementById("gpa");
const note = document.getElementById("note");

// Sizes the number to fill the content width, capped so it fits the viewport's height.
function fit() {
  const main = out.parentElement;
  const cs = getComputedStyle(main);
  const width = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  out.style.fontSize = "100px";
  const size = 100 * width / out.getBoundingClientRect().width;
  out.style.fontSize = `${Math.min(size, innerHeight * 0.8)}px`;
}

const ERRORS = { 404: "No GPA yet", 502: "API unreachable", 503: "No data yet" };
let shown = false;

function show(text, message) {
  out.textContent = text;
  note.textContent = message;
  fit();
}

// A failed refresh keeps the last GPA on screen and puts the error in the header.
function fail(message) {
  if (shown) note.textContent = message;
  else show("—", message);
}

async function load() {
  try {
    const res = await fetch("/api/gpa");
    if (!res.ok) return fail(ERRORS[res.status] || `Error ${res.status}`);
    show(new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }).format(await res.json()), "Percent");
    shown = true;
  } catch {
    fail("API unreachable");
  }
}

addEventListener("resize", fit);
document.fonts.ready.then(fit);
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
