<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #fff; color: #000; }
  body {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: clamp(16px, 3vw, 48px);
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 1em;
    border-top: clamp(4px, 0.6vw, 10px) solid #000;
    padding-top: 0.6em;
    font-size: clamp(14px, 1.4vw, 22px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  #updated {
    display: block;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  /* Switches the unit. A button for keyboards and screen readers, styled as plain header text. */
  #unit {
    all: unset;
    align-self: start; /* level with the title, not centred on the two lines beside it */
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #unit:focus-visible { outline: 2px solid #000; outline-offset: 0.15em; }
  #gpa {
    align-self: end;
    justify-self: start;
    white-space: nowrap;
    font-weight: 700;
    font-size: 30vw; /* refitted to the width by fit() */
    line-height: 0.78; /* hugs the digits' cap height, so the bottom padding reads true */
    letter-spacing: -0.055em;
    padding-right: 0.055em; /* cancels the tracking after the last digit */
  }
</style>
</head>
<body>
<main>
  <header>
    <div>Grade point average<span id="updated">&nbsp;</span></div>
    <button id="unit" type="button">Percent</button>
  </header>
  <p id="gpa" aria-live="polite">&nbsp;</p>
</main>
<script>
const out = document.getElementById("gpa");
const unitButton = document.getElementById("unit");
const updated = document.getElementById("updated");

// Sizes the number to fill the content width, capped so it fits the viewport's height.
function fit() {
  const main = out.parentElement;
  const cs = getComputedStyle(main);
  const width = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  out.style.fontSize = "100px";
  const size = 100 * width / out.getBoundingClientRect().width;
  out.style.fontSize = `${Math.min(size, innerHeight * 0.8)}px`;
}

const ERRORS = { 404: "No GPA yet", 502: "API unreachable", 503: "No data yet" };
// Always three places, as Infinite Campus publishes it (99.150, not 99.15).
const places = new Intl.NumberFormat("en-US", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const SCALE_KEY = "biggpa-scale";

let gpa = null;        // the last GPA received, as a percentage
let seenAt = null;     // when the scraper last read it (the API's X-Last-Seen-At)
let error = "";        // why the last refresh failed, if it did
let fourScale = false; // show the 4.0 scale instead of the percentage
try { fourScale = localStorage.getItem(SCALE_KEY) === "4"; } catch {}

// e.g. "just now", "25 min ago", "2 h ago", "3 days ago"
function ago(date) {
  const mins = Math.floor((Date.now() - date) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  if (mins < 24 * 60) return `${Math.floor(mins / 60)} h ago`;
  const days = Math.floor(mins / (24 * 60));
  return `${days} ${days === 1 ? "day" : "days"} ago`;
}

// A failed refresh keeps the last GPA on screen and puts the error before the update time.
function renderUpdated() {
  const stamp = seenAt && `updated ${ago(seenAt)}`;
  const text = [error, stamp].filter(Boolean).join(" · ");
  updated.textContent = text ? text[0].toUpperCase() + text.slice(1) : " ";
  updated.title = seenAt ? seenAt.toLocaleString() : "";
}

function render() {
  // The 4.0 scale is the percentage mapped linearly (100% = 4.000), to the same three places.
  // Weighting can lift it past 4, as it lifts the percentage past 100.
  if (gpa != null) out.textContent = places.format(fourScale ? gpa / 25 : gpa);
  else if (error) out.textContent = "—";
  unitButton.textContent = fourScale ? "4.0 scale" : "Percent";
  renderUpdated();
  fit();
}

async function load() {
  try {
    const res = await fetch("/api/gpa");
    if (res.ok) {
      gpa = await res.json();
      const seen = Date.parse(res.headers.get("X-Last-Seen-At"));
      seenAt = Number.isNaN(seen) ? null : new Date(seen);
      error = "";
    } else {
      error = ERRORS[res.status] || `Error ${res.status}`;
    }
  } catch {
    error = "API unreachable";
  }
  render();
}

unitButton.addEventListener("click", () => {
  fourScale = !fourScale;
  try { localStorage.setItem(SCALE_KEY, fourScale ? "4" : "percent"); } catch {}
  render();
});

addEventListener("resize", fit);
document.fonts.ready.then(fit);
render();
load();
setInterval(load, 5 * 60 * 1000);
setInterval(renderUpdated, 60 * 1000);
</script>
</body>
</html>
