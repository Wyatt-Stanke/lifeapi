<!doctype html>
<html lang="en" data-big="{{name}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" id="theme">
<title>&nbsp;</title>
<link rel="icon" id="icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<style>
  /* Each page's colours: the background, and everything drawn on it. The favicon and the
     browser's theme colour read them from here. */
  :root { --bg: #fff; --fg: #000; }
  :root[data-big="missing"] { --bg: #da291c; --fg: #fff; } /* Swiss red */
  :root[data-big="next"] { --bg: #fc0; --fg: #000; } /* Swiss Post yellow */
  :root[data-big="due"] { --bg: #0046ad; --fg: #fff; } /* blue */
  :root[data-big="status"] { --bg: #000; --fg: #fff; }
  /* The rule along the top, the page's only ornament: GPA's is solid, and each of the others is a
     variation on it about what its page counts. --bar is its height, --stroke the thin lines'. */
  :root { --rule: clamp(4px, 0.6vw, 10px); --stroke: calc(var(--rule) / 2); --bar: var(--rule); }
  :root[data-big="status"] { --bar: calc(var(--rule) * 3); }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr; /* the header, then the rest at the bottom */
    grid-template-columns: minmax(0, 1fr); /* lets the caption's lines cut off, not widen the page */
    padding: clamp(16px, 3vw, 48px);
    /* The value's font hangs its descent below its 0.78em line box. There's no ink there, but
       it would make the page scroll. */
    overflow: hidden;
  }
  header {
    position: relative; /* for #rule */
    display: flex;
    justify-content: space-between;
    gap: 1em;
    padding-top: calc(var(--bar) + 0.6em);
    font-size: clamp(14px, 1.4vw, 22px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  /* Drawn with gradients, so every part takes --fg. Out of the header's flex layout. */
  #rule { position: absolute; inset: 0 0 auto; height: var(--bar); background: var(--fg); }
  /* Missing: a piece missing, one column of a 12-column grid. */
  :root[data-big="missing"] #rule {
    background: linear-gradient(90deg, var(--fg) 58.333%, transparent 0 66.667%, var(--fg) 0);
  }
  /* Next: a ruler over the days ahead, its ticks standing on the rule (above it, so the rule stays
     where the other pages' is): one at the start of each day (--tick apart, set from ?days=) and
     one at the end. */
  :root[data-big="next"] #rule::before {
    content: "";
    position: absolute;
    inset: auto 0 100%;
    height: var(--rule);
    background:
      linear-gradient(90deg, transparent calc(100% - var(--stroke)), var(--fg) 0),
      repeating-linear-gradient(90deg, var(--fg) 0 var(--stroke), transparent 0 var(--tick, calc(100% / 7)));
  }
  /* Due: a gap like missing's that laps the rule once a minute, off the right end and back on at
     the left. #hand spans the rule, so translateX(100%) is one lap, and carries the gap twice, a
     lap apart, so one copy comes on at the left as the other goes off at the right. Painted in
     --bg, which is as good as cut out on the page's flat colour. */
  :root[data-big="due"] #rule { overflow: hidden; }
  #hand { position: absolute; inset: 0; }
  #hand::before, #hand::after {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 8.333%;
    background: var(--bg);
  }
  #hand::after { left: -100%; }
  /* Status: a signal trace, flat but for one pulse, in the eleventh of twelve columns. */
  :root[data-big="status"] #rule {
    background:
      linear-gradient(90deg, var(--fg) 83.333%, transparent 0 91.667%, var(--fg) 0)
        bottom / 100% var(--stroke) no-repeat,
      linear-gradient(90deg, transparent 83.333%, var(--fg) 0 91.667%, transparent 0)
        top / 100% var(--stroke) no-repeat,
      linear-gradient(90deg, transparent 83.333%, var(--fg) 0 calc(83.333% + var(--stroke)),
        transparent 0 calc(91.667% - var(--stroke)), var(--fg) 0 91.667%, transparent 0);
  }
  #updated {
    display: block;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  #window { align-self: start; text-align: right; }
  /* Switches the GPA's unit. A button for keyboards and screen readers, styled as plain header text. */
  #unit {
    all: unset;
    align-self: start; /* level with the title, not centred on the two lines beside it */
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #unit:focus-visible { outline: 2px solid var(--fg); outline-offset: 0.15em; }
  /* The due page's item, just above the countdown. */
  #caption {
    align-self: end;
    padding-bottom: 0.5em; /* not a margin, so fit() counts it */
    font-size: clamp(18px, 2.6vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  #what {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  #where {
    display: block;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #value {
    align-self: end;
    justify-self: start;
    white-space: nowrap;
    font-weight: 700;
    font-size: 30vw; /* refitted to the width by fit() */
    line-height: 0.78; /* hugs the digits' cap height, so the bottom padding reads true */
    letter-spacing: -0.055em;
    padding-right: 0.055em; /* cancels the tracking after the last digit */
  }
</style>
</head>
<body>
<main>
  <header>
    <i id="rule" aria-hidden="true"><i id="hand"></i></i>
    <div><span id="heading"></span><span id="updated">&nbsp;</span></div>
    <button id="unit" type="button">Percent</button>
    <span id="window"></span>
  </header>
  <p id="caption" hidden><span id="what"></span><span id="where"></span></p>
  <p id="value" aria-live="polite">&nbsp;</p>
</main>
<script>
// Which /big/<name> page this is: serve.py fills in data-big, since --host-page serves one at /.
// Each shows the API's /json/<name>.
const NAME = document.documentElement.dataset.big;
const PAGES = {
  gpa: { title: "GPA", heading: "Wyatt Stanke's GPA" },
  missing: { title: "Missing", heading: "Wyatt Stanke's missing work", window: "Last" },
  next: { title: "Upcoming", heading: "Wyatt Stanke's upcoming work", window: "Next" },
  due: { title: "Due", heading: "Wyatt Stanke's next deadline", window: "Next" },
  status: { title: "Status", heading: "Failing lifeapi sources" },
};
const page = PAGES[NAME];
const isGpa = NAME === "gpa", isDue = NAME === "due";
// The window counted over (or searched, for due), passed on to the API: ?days=, 7 by default
// as there.
const DAYS = new URLSearchParams(location.search).get("days") || "7";
const url = `/api/json/${NAME}` + (page.window ? `?days=${encodeURIComponent(DAYS)}` : "");

const out = document.getElementById("value");
const unitButton = document.getElementById("unit");
const updated = document.getElementById("updated");
const caption = document.getElementById("caption");
const rule = document.getElementById("rule");
const hand = document.getElementById("hand");
const icon = document.getElementById("icon");
const iconCanvas = Object.assign(document.createElement("canvas"), { width: 64, height: 64 });
const style = getComputedStyle(document.documentElement);
const bg = style.getPropertyValue("--bg").trim();
const fg = style.getPropertyValue("--fg").trim();

document.title = page.title;
document.getElementById("heading").textContent = page.heading;
document.getElementById("theme").content = bg;
// The header's right side: the GPA's unit switch, or the window of the pages that have one.
if (!isGpa) unitButton.remove();
if (page.window) {
  document.getElementById("window").textContent =
    `${page.window} ${DAYS} ${DAYS === "1" ? "day" : "days"}`;
} else document.getElementById("window").remove();
if (!isDue) {
  caption.remove();
  hand.remove();
}
// The next page's ruler: a tick a day, or a week when the window is over a month.
const days = Number(DAYS);
if (NAME === "next" && Number.isInteger(days) && days > 0) {
  rule.style.setProperty("--tick", `${100 * (days > 31 ? 7 : 1) / days}%`);
}

// Sizes the number to fill the content width, capped so it fits the height left under the
// header (and caption), and at 80% of the viewport's.
function fit() {
  const main = out.parentElement;
  const cs = getComputedStyle(main);
  const width = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const above = [...main.children].filter(el => el !== out)
    .reduce((sum, el) => sum + el.getBoundingClientRect().height, 0);
  const height = innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - above;
  out.style.fontSize = "100px";
  const size = 100 * width / out.getBoundingClientRect().width;
  const lineHeight = parseFloat(getComputedStyle(out).lineHeight) / 100;
  out.style.fontSize = `${Math.min(size, height / lineHeight, innerHeight * 0.8)}px`;
}

const ERRORS = { 404: "No GPA yet", 422: "Invalid days", 502: "API unreachable", 503: "No data yet" };
// Always three places, as Infinite Campus publishes it (99.150, not 99.15).
const places = new Intl.NumberFormat("en-US", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const deadline = new Intl.DateTimeFormat("en-US", {
  weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
});
const SCALE_KEY = "biggpa-scale"; // named when the page was /biggpa; renaming would forget the choice

let data = null;       // the last JSON received
let seenAt = null;     // when the scraper last read it (the API's last_seen_at or updated_at)
let error = "";        // why the last refresh failed, if it did
let fourScale = false; // show the GPA on the 4.0 scale instead of as a percentage
try { fourScale = localStorage.getItem(SCALE_KEY) === "4"; } catch {}

// e.g. "just now", "25 min ago", "2 h ago", "3 days ago"
function ago(date) {
  const mins = Math.floor((Date.now() - date) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  if (mins < 24 * 60) return `${Math.floor(mins / 60)} h ago`;
  const days = Math.floor(mins / (24 * 60));
  return `${days} ${days === 1 ? "day" : "days"} ago`;
}

// The time left until `due`, floored to the minute: "2d 4h", "3h 20m", "42m". With `short`,
// only its largest unit ("2d", "3h", "42m"), for the favicon.
function left(due, short = false) {
  const mins = Math.max(0, Math.floor((due - Date.now()) / 60000));
  const d = Math.floor(mins / 1440), h = Math.floor(mins / 60) % 24, m = mins % 60;
  const [big, small] = d ? [`${d}d`, `${h}h`] : h ? [`${h}h`, `${m}m`] : [`${m}m`, ""];
  return short || !small ? big : `${big} ${small}`;
}

// The value as shown, from the last JSON received; `short` for the favicon's few characters.
// The 4.0 scale is the percentage mapped linearly (100% = 4.000), to the same three places.
// Weighting can lift it past 4, as it lifts the percentage past 100. The countdown is worked out
// here from due_at, not the API's minutes, so it keeps counting between refreshes.
function shown(short = false) {
  if (isGpa) return places.format(fourScale ? data.value / 25 : data.value);
  if (!isDue) return String(data.value);
  if (!data.due_at) return short ? "—" : "None";
  return left(Date.parse(data.due_at), short);
}

// A failed refresh keeps the last value on screen and puts the error before the update time.
function renderUpdated() {
  const stamp = seenAt && `updated ${ago(seenAt)}`;
  const text = [error, stamp].filter(Boolean).join(" · ");
  updated.textContent = text ? text[0].toUpperCase() + text.slice(1) : " ";
  updated.title = seenAt ? seenAt.toLocaleString() : "";
}

// The due page's caption: the item, then its course and deadline. None when nothing is due.
function renderCaption() {
  caption.hidden = !data.due_at;
  if (!data.due_at) return;
  document.getElementById("what").textContent = data.title || "Untitled";
  document.getElementById("where").textContent = [
    data.course_name, `due ${deadline.format(new Date(data.due_at))}`,
  ].filter(Boolean).join(" · ");
}

// The due page's gap laps the rule once a minute, timed so it straddles the ends, half off the
// right and half back on at the left, as the countdown's minute turns over: its left edge is then
// a lap less half its width (1/24 of the rule) along. None when nothing is due, or for reduced
// motion.
const LAP = 60000, SEAM = LAP * (1 - 1 / 24);
let sweep = null;
function renderHand() {
  const ms = data?.due_at ? Date.parse(data.due_at) - Date.now() : NaN;
  hand.hidden = !(ms > 0) || matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (hand.hidden) {
    sweep?.cancel();
    sweep = null;
    return;
  }
  sweep ??= hand.animate([{ transform: "none" }, { transform: "translateX(100%)" }],
                         { duration: LAP, iterations: Infinity });
  sweep.currentTime = (LAP - ms % LAP + SEAM) % LAP;
}

// Draws the value as the favicon, in the page's colours, on an opaque square so it reads on dark
// tab strips too. A canvas, not an SVG icon, because an SVG favicon can't use the page's web font.
function renderIcon(text) {
  const ctx = iconCanvas.getContext("2d");
  const size = iconCanvas.width, half = size / 2;
  const font = px => `800 ${px}px Inter, "Helvetica Neue", Helvetica, Arial, sans-serif`;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = fg;
  ctx.textAlign = "center";
  if (isGpa) {
    // The digits before the point on the top half, the three after it on the bottom, the point
    // implied, right-aligned in three columns so 99.150 reads " 99" over "150". Each digit is
    // centred in its column (fillText's maxWidth squeezes it to fit), so the columns line up
    // whatever the font's digit widths.
    const [whole, frac] = text.split(".");
    const column = (size - 2) / 3;
    ctx.font = font(38);
    const cap = ctx.measureText("0").actualBoundingBoxAscent;
    [whole, frac].forEach((digits, row) => {
      [...digits.padStart(3).slice(-3)].forEach((digit, i) => {
        ctx.fillText(digit, 1 + column * (i + 0.5), row * half + (half + cap) / 2, column);
      });
    });
  } else {
    // One row, centred, shrunk to fit the width when it has several characters.
    ctx.font = font(60);
    ctx.font = font(Math.min(60, 60 * (size - 4) / ctx.measureText(text).width));
    const cap = ctx.measureText("0").actualBoundingBoxAscent;
    ctx.fillText(text, half, (size + cap) / 2);
  }
  icon.href = iconCanvas.toDataURL("image/png");
}

function render() {
  if (data) {
    const text = shown();
    out.textContent = text;
    document.title = `${page.title} - ${text}`;
    renderIcon(shown(true));
    if (isDue) renderCaption();
  } else if (error) out.textContent = "—";
  if (isDue) renderHand();
  unitButton.textContent = fourScale ? "4.0 scale" : "Percent";
  renderUpdated();
  fit();
  schedule();
}

async function load() {
  try {
    const res = await fetch(url);
    if (res.ok) {
      data = await res.json();
      const seen = Date.parse(data.last_seen_at ?? data.updated_at);
      seenAt = Number.isNaN(seen) ? null : new Date(seen);
      error = "";
    } else {
      error = ERRORS[res.status] || `Error ${res.status}`;
    }
  } catch {
    error = "API unreachable";
  }
  render();
}

// Redraws a minute after each render, for the "Updated" line. On the due page, as the countdown's
// minute turns over instead, which is at the deadline's seconds, and once the deadline has passed
// it fetches the next one.
let timer;
function schedule() {
  const ms = isDue && data?.due_at ? Date.parse(data.due_at) - Date.now() : 0;
  clearTimeout(timer);
  if (ms > 0 && ms < 60000) timer = setTimeout(load, ms + 100);
  else timer = setTimeout(render, ms > 0 ? ms % 60000 + 100 : 60 * 1000);
}

unitButton.addEventListener("click", () => {
  fourScale = !fourScale;
  try { localStorage.setItem(SCALE_KEY, fourScale ? "4" : "percent"); } catch {}
  render();
});

addEventListener("resize", fit);
document.fonts.ready.then(render); // redraws the favicon in Inter too
render();
load();
// Keeps the title and favicon current in a background tab. Browsers throttle hidden tabs' timers
// to about once a minute, which a 3-minute interval doesn't notice. Nothing here waits on
// requestAnimationFrame, which hidden tabs never run. A frozen or discarded tab stops entirely,
// so refresh as soon as it comes back, or the network does.
setInterval(load, 3 * 60 * 1000);
document.addEventListener("resume", load); // Chrome, after freezing the tab
addEventListener("online", load);
</script>
</body>
</html>
