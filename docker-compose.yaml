# Deployed by Coolify (Docker Compose build pack, built on the server) and run locally with
# `podman compose up -d --build`, which also merges docker-compose.override.yaml (host
# ports). No host ports here: on Coolify the proxy routes the domain to `frontend:8080`.
#
# All three services share the `data` volume: the SQLite DB, the logged-in browser
# profile and debug snapshots. Values below come from Coolify's environment variables, or
# locally from `.env` next to this file.

# Rotates each container's stdout log, which Docker's default json-file driver never does.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    build: .
    command: ["python", "-m", "lifeapi.api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LIFEAPI_API_TOKEN: ${LIFEAPI_API_TOKEN:?set LIFEAPI_API_TOKEN, the API's bearer token}
      # The server's SSH destination, shown in /sources' login_command (deploy/reauth.py).
      LIFEAPI_REAUTH_TARGET: ${LIFEAPI_REAUTH_TARGET:-}
      # The default schedule, which /sources reports. Must match the scraper's.
      LIFEAPI_SCRAPE_INTERVAL: ${LIFEAPI_SCRAPE_INTERVAL:-7200}
    volumes:
      - data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # The explorer UI. It proxies /api/* (and the docs at /api/docs) to the api service, so
  # this is the only service that needs a public domain. Enter the API token in the page.
  # --host-page serves /big/gpa at the root of a second domain given to this service.
  frontend:
    build: .
    command: ["python", "frontend/serve.py", "--host", "0.0.0.0", "--port", "8080", "--api", "http://api:8000",
              "--host-page", "gpa.stan.ke=/big/gpa"]
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # Scrapes each source on its schedule (set through the API; by default every
  # LIFEAPI_SCRAPE_INTERVAL seconds), checked every minute, plus whatever POST /sync asks
  # for (checked every LIFEAPI_SYNC_POLL seconds). To finish a sign-in
  # challenge by hand, see "Finishing a sign-in challenge" in the README.
  scraper:
    build: .
    command: ["/app/deploy/container/scrape-loop.sh"]
    environment:
      GOOGLE_USERNAME: ${GOOGLE_USERNAME:?}
      GOOGLE_PASSWORD: ${GOOGLE_PASSWORD:?}
      COLLEGEBOARD_USERNAME: ${COLLEGEBOARD_USERNAME:?}
      COLLEGEBOARD_PASSWORD: ${COLLEGEBOARD_PASSWORD:?}
      LIFEAPI_SCRAPE_INTERVAL: ${LIFEAPI_SCRAPE_INTERVAL:-7200}
      LIFEAPI_SCRAPE_MAX_RUN: ${LIFEAPI_SCRAPE_MAX_RUN:-3600}
      # Seconds one source may take before it's stopped and recorded as failed.
      LIFEAPI_SOURCE_TIMEOUT: ${LIFEAPI_SOURCE_TIMEOUT:-1800}
      LIFEAPI_SYNC_POLL: ${LIFEAPI_SYNC_POLL:-10}
      LIFEAPI_TIMEOUT_SCALE: ${LIFEAPI_TIMEOUT_SCALE:-3}
      CLEVER_PORTAL_URL: ${CLEVER_PORTAL_URL:-https://clever.com/in/jerseycity/}
      # Optional: http://user:password@host:port, a proxy for the sites whose bot checks
      # challenge this server's IP (VHL's Cloudflare). LIFEAPI_PROXY_DOMAINS lists them
      # (default vhlcentral.com,challenges.cloudflare.com). See lifeapi/scraper/proxy.py.
      LIFEAPI_PROXY: ${LIFEAPI_PROXY:-}
      LIFEAPI_PROXY_DOMAINS: ${LIFEAPI_PROXY_DOMAINS:-}
      INFINITE_CAMPUS_URL: ${INFINITE_CAMPUS_URL:-https://jerseycitynj.infinitecampus.org/campus/portal/students/jerseycity.jsp}
    volumes:
      - data:/data
    # Chrome uses /dev/shm heavily; the 64 MB container default crashes tabs.
    shm_size: 1gb
    # Reaps orphaned Chrome processes, e.g. after deploy/reauth.py stops a headed scrape.
    init: true
    # Unhealthy only when a run hangs (see deploy/container/healthcheck.sh).
    healthcheck:
      test: ["CMD", "/app/deploy/container/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

volumes:
  data:
